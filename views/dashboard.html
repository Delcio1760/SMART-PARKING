<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Smart Parking</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link rel="stylesheet" href="../assets/css/main.css">

  <style>
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #1a1a1a !important;
      color: #f0f0f0 !important;
      border: 1px solid #333 !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.7) !important;
      border-radius: 14px !important;
    }

    .leaflet-popup-content { margin: 0 !important; }
    .leaflet-popup-tip-container { display: none; }

    .leaflet-control-zoom a {
      background: #1a1a1a !important;
      color: #f5a623 !important;
      border-color: #333 !important;
    }

    .leaflet-control-zoom a:hover {
      background: #222 !important;
    }

    #park-map,
    .leaflet-container,
    .leaflet-pane,
    .leaflet-top,
    .leaflet-bottom {
      z-index: 1 !important;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999 !important;
    }

    .modal {
      position: relative;
      z-index: 10000 !important;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-lg);
    }

    .section-header h2 {
      font-size: 1.2rem;
      font-family: var(--font-display);
    }

    .vehicles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-md);
    }

    .filter-row {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: var(--space-md);
      align-items: end;
      margin-bottom: var(--space-xl);
    }

    @media(max-width:768px) {
      .filter-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body data-page="dashboard">

  <div id="navbar-placeholder"></div>

  <main class="page-wrapper">
    <div class="container section">

      <h1 style="font-size:1.8rem;font-family:var(--font-display);margin-bottom:var(--space-2xl)">
        <span id="user-greeting">Olá</span> 👋
      </h1>

      <div class="section-header">
        <h2>Nossos parques no mapa</h2>
      </div>

      <div id="park-map" style="width:100%;height:360px;border-radius:var(--radius-lg);border:1px solid var(--color-border);margin-bottom:var(--space-xl);"></div>

      <div class="section-header">
        <h2>Meus Veículos</h2>
      </div>

      <div class="vehicles-grid" id="vehicles-list"></div>

      <div style="margin-top:var(--space-2xl)">
        <div class="section-header">
          <h2>Filtros</h2>
        </div>

        <div class="filter-row">
          <div class="form-group">
            <label class="form-label">Procurar parque ou localização</label>
            <input class="form-input" id="park-search" placeholder="Procurar qualquer parque ou localização...">
          </div>

          <div class="form-group">
            <label class="form-label">Selecione a localização</label>
            <select class="form-select" id="city-filter">
              <option value="">Todas</option>
              <option value="Porto">Porto</option>
              <option value="Matosinhos">Matosinhos</option>
              <option value="Gaia">Gaia</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Check In / Check Out</label>
            <input class="form-input" type="date">
          </div>

          <button class="btn btn-primary" style="height:42px">Agendar</button>
        </div>
      </div>

      <div class="section-header">
        <h2>Meus parques favoritos <span style="color:var(--color-accent)">★</span></h2>
        <a href="#" style="font-size:0.85rem;color:var(--color-text-muted)">+ Adicionar parque</a>
      </div>

      <div class="grid-3" id="favorite-parks"></div>

      <div class="section-header" style="margin-top:var(--space-2xl)">
        <h2>Parques disponíveis agora</h2>
        <a href="#" style="font-size:0.85rem;color:var(--color-accent)">Ver todas →</a>
      </div>

      <div class="grid-3" id="all-parks"></div>

    </div>
  </main>

  <div class="modal-overlay" id="modal-reserve">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Reservar Lugar</div>
        <button class="modal-close">✕</button>
      </div>

      <form id="reserve-form">
        <input type="hidden" id="reserve-park-id">

        <div class="flex-col" style="gap:var(--space-md)">
          <div style="padding:var(--space-md);background:var(--color-surface-2);border-radius:var(--radius-sm)">
            <div style="font-size:0.8rem;color:var(--color-text-muted)">Parque selecionado</div>
            <div style="font-weight:700;font-family:var(--font-display)" id="reserve-park-name">—</div>
          </div>

          <div class="form-group">
            <label class="form-label">Veículo</label>
            <select class="form-select" id="reserve-vehicle">
              <option>Nenhum veículo</option>
            </select>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)">
            <div class="form-group">
              <label class="form-label">Data</label>
              <input class="form-input" id="reserve-date" type="date" required>
            </div>

            <div class="form-group">
              <label class="form-label">Hora de início</label>
              <input class="form-input" id="reserve-start" type="time" min="07:00" max="22:00" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Hora de fim</label>
            <input class="form-input" id="reserve-end" type="time" min="07:00" max="22:00" required>
          </div>

          <p style="font-size:0.78rem;color:var(--color-text-muted)">
            ℹ️ Reservas disponíveis entre 07h00 e 22h00. Tarifa: €1.50/hora.
          </p>

          <button class="btn btn-primary" type="submit" style="width:100%">
            Confirmar Reserva
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <div id="toast-container"></div>

  <script src="../assets/js/View.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../assets/js/map.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const storedUser = localStorage.getItem('user');
      let user = null;
      let parks = [];

      try {
        user = storedUser ? JSON.parse(storedUser) : null;
      } catch (err) {
        console.error('Erro ao ler o user na localStorage:', err);
      }

      document.body.insertAdjacentHTML('afterbegin', View.renderNavbar(user));
      document.body.insertAdjacentHTML('beforeend', View.renderFooter());

      if (!user) {
        alert('Sessão expirada. Por favor, faça login.');
        window.location.href = 'login.html';
        return;
      }

      const greetingEl = document.getElementById('user-greeting');

      if (greetingEl) {
        const firstName = user.name ? user.name.split(' ')[0] : 'Utilizador';
        greetingEl.textContent = `Olá, ${firstName}`;
      }

      const renderCards = (containerId, list) => {
        const el = document.getElementById(containerId);
        if (!el) return;

        el.innerHTML = list.map(p => View.renderParkCard(p)).join('');
        setupCardClicks(el);
      };

      function setupCardClicks(container) {
        container.querySelectorAll('.btn-reserve').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();

            const id = Number(btn.dataset.id);
            const park = parks.find(p => p.id === id);

            if (park) {
              MapModule.focusPark(park);
            }

            openReserveModal(id);
          });
        });
      }

      async function loadParks() {
        try {
          const response = await fetch('http://localhost:3000/api/parks');

          if (!response.ok) {
            throw new Error('Erro HTTP: ' + response.status);
          }

          parks = await response.json();

          console.log('PARKS DA API:', parks);

          MapModule.init('park-map', parks, (parkId) => {
            openReserveModal(parkId);
          });

          renderCards('favorite-parks', parks.slice(0, 3));
          renderCards('all-parks', parks);

        } catch (err) {
          console.error('Erro ao carregar parques:', err);
          View.showToast('Erro ao carregar parques', 'error');
        }
      }

      function filterParks() {
        const searchValue = document.getElementById('park-search')?.value.toLowerCase() || '';
        const cityValue = document.getElementById('city-filter')?.value || '';

        const filtered = parks.filter(p => {
          const matchesSearch =
            p.name.toLowerCase().includes(searchValue) ||
            p.city.toLowerCase().includes(searchValue) ||
            p.address.toLowerCase().includes(searchValue);

          const matchesCity = cityValue === '' || p.city === cityValue;

          return matchesSearch && matchesCity;
        });

        MapModule.updateParks(filtered);
        renderCards('all-parks', filtered);
      }

      document.getElementById('park-search')?.addEventListener('input', filterParks);
      document.getElementById('city-filter')?.addEventListener('change', filterParks);

      function openReserveModal(parkId) {
        const park = parks.find(p => p.id === Number(parkId));

        if (!park) return;

        document.getElementById('reserve-park-id').value = park.id;
        document.getElementById('reserve-park-name').textContent = park.name;
        document.getElementById('reserve-date').value = new Date().toISOString().split('T')[0];

        document.getElementById('modal-reserve').classList.add('active');
      }

      document.querySelector('.modal-close')?.addEventListener('click', () => {
        document.getElementById('modal-reserve').classList.remove('active');
      });

      document.getElementById('modal-reserve')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
          e.currentTarget.classList.remove('active');
        }
      });

      document.getElementById('reserve-form')?.addEventListener('submit', (e) => {
        e.preventDefault();

        const date = document.getElementById('reserve-date').value;
        const start = document.getElementById('reserve-start').value;
        const end = document.getElementById('reserve-end').value;

        if (!date || !start || !end) {
          View.showToast('Preenche todos os campos.', 'error');
          return;
        }

        View.showToast('Reserva submetida com sucesso! ✓', 'success');
        document.getElementById('modal-reserve').classList.remove('active');
      });

      document.addEventListener('click', (e) => {
        if (e.target.id === 'btn-logout') {
          localStorage.removeItem('user');
          localStorage.removeItem('sp_user');

          View.showToast('Sessão terminada.', 'info');

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        }
      });

      loadParks();

    });
  </script>

</body>
</html>
