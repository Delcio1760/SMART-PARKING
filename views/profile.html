<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — Smart Parking</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .profile-layout { display: grid; grid-template-columns: 300px 1fr; gap: var(--space-2xl); }
    @media(max-width:900px) { .profile-layout { grid-template-columns: 1fr; } }

    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem; font-weight: 800; color: #111;
      margin-bottom: var(--space-md);
    }

    .profile-sidebar {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      height: fit-content;
    }

    .sidebar-nav { margin-top: var(--space-xl); display: flex; flex-direction: column; gap: 4px; }
    .sidebar-link {
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all var(--transition);
      display: flex; align-items: center; gap: var(--space-sm);
      text-decoration: none;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: var(--color-surface-2);
      color: var(--color-text);
    }
    .sidebar-link.active { color: var(--color-accent); }

    .vehicle-card {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
    }
    
  .modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 1000;
  align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-xl);
    padding: var(--space-xl);
    width: 100%; max-width: 460px;
  }
  </style>
</head>
<body data-page="profile">

  <main class="page-wrapper">
    <div class="container section">

      <div class="section-label">Conta</div>
      <h1 class="section-title" style="margin-bottom:var(--space-2xl)">Meu Perfil</h1>

      <div class="profile-layout">

        <!-- Sidebar -->
        <aside class="profile-sidebar">
          <div class="avatar" id="avatar-initials">?</div>
          <div style="font-weight:700;font-family:var(--font-display)" id="sidebar-name">A carregar...</div>
          <div style="font-size:0.85rem;color:var(--color-text-muted)" id="sidebar-email">—</div>
          <div class="sidebar-nav">
            <div class="sidebar-link active">👤 Dados Pessoais</div>
            <a href="reservations.html" class="sidebar-link">📅 Reservas</a>
            <a href="dashboard.html" class="sidebar-link">🚗 Veículos</a>
            <div class="sidebar-link" style="color:var(--color-danger)" id="btn-logout">🚪 Terminar Sessão</div>
          </div>
        </aside>

        <!-- Main content -->
        <div class="flex-col" style="gap:var(--space-xl)">

          <!-- Dados Pessoais -->
          <div class="card" style="padding:var(--space-xl)">
            <h2 style="font-size:1.1rem;font-family:var(--font-display);margin-bottom:var(--space-xl)">Dados Pessoais</h2>
            <form id="profile-form">
              <div class="flex-col" style="gap:var(--space-md)">
                <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)">
                  <div class="form-group">
                    <label class="form-label">Nome completo</label>
                    <input class="form-input" id="profile-name" type="text" placeholder="O teu nome">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Email</label>
                    <input class="form-input" id="profile-email" type="email" placeholder="O teu email">
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Contacto</label>
                  <input class="form-input" id="profile-contact" type="tel" placeholder="+351 9xx xxx xxx">
                </div>
                <div class="flex-gap" style="justify-content:flex-end;align-items:center;gap:var(--space-md)">
                  <span id="profile-msg" style="font-size:0.85rem;color:var(--color-success)"></span>
                  <button class="btn btn-primary" type="submit">Guardar alterações</button>
                </div>
              </div>
            </form>
          </div>

          <!-- Veículos -->
         <div class="card" style="padding:var(--space-xl)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-lg)">
            <h2 style="font-size:1.1rem;font-family:var(--font-display)">Meus Veículos</h2>
            <button class="btn btn-primary" id="btn-add-vehicle" style="font-size:0.85rem;padding:8px 16px">+ Adicionar Veículo</button>
          </div>
          <div id="vehicles-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-md)">
            <div style="color:var(--color-text-muted);font-size:0.9rem">A carregar...</div>
          </div>
        </div>

      <!-- Modal -->
            <div class="modal-overlay" id="vehicle-modal">
              <div class="modal-box">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-lg)">
                  <h3 style="font-family:var(--font-display)">Adicionar Veículo</h3>
                  <span id="btn-close-modal" style="cursor:pointer;font-size:1.2rem">✕</span>
                </div>
                <form id="vehicle-form">
                  <div class="flex-col" style="gap:var(--space-md)">
                    <div class="form-group">
                      <label class="form-label">Matrícula *</label>
                      <input class="form-input" id="v-plate" type="text" placeholder="AA-00-BB" required>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)">
                      <div class="form-group">
                        <label class="form-label">Marca *</label>
                        <input class="form-input" id="v-brand" type="text" placeholder="Toyota" required>
                      </div>
                      <div class="form-group">
                        <label class="form-label">Modelo *</label>
                        <input class="form-input" id="v-model" type="text" placeholder="Corolla" required>
                      </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)">
                      <div class="form-group">
                        <label class="form-label">Cor</label>
                        <input class="form-input" id="v-color" type="text" placeholder="Preto">
                      </div>
                      <div class="form-group">
                        <label class="form-label">Tipo de combustível</label>
                        <select class="form-input" id="v-type">
                          <option value="Gasolina">Gasolina</option>
                          <option value="Diesel">Diesel</option>
                          <option value="Elétrico">Elétrico</option>
                          <option value="Híbrido">Híbrido</option>
                        </select>
                      </div>
                    </div>
                    <div style="display:flex;justify-content:flex-end;gap:var(--space-md);margin-top:var(--space-sm)">
                      <span id="vehicle-msg" style="font-size:0.85rem;align-self:center"></span>
                      <button type="button" class="btn" id="btn-cancel-vehicle">Cancelar</button>
                      <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          <!-- Reservas Recentes -->
          <div class="card" style="padding:var(--space-xl)">
            <div class="flex-between" style="margin-bottom:var(--space-lg)">
              <h2 style="font-size:1.1rem;font-family:var(--font-display)">Reservas Recentes</h2>
              <a href="reservations.html" style="font-size:0.85rem;color:var(--color-accent)">Ver todas →</a>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Parque</th>
                    <th>Lugar</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Estado</th>
                    <th>Valor</th>
                  </tr>
                </thead>
                <tbody id="profile-reservations">
                  <tr><td colspan="6" style="text-align:center;color:var(--color-text-muted);padding:var(--space-lg)">Sem reservas recentes.</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <script src="../assets/js/View.js"></script>
  <script src="../assets/js/vehicles.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    // 1. Ler sessão
    const token = localStorage.getItem('token');
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('user'));
    } catch (e) {}

    if (!user || !token) {
      alert('Sessão expirada. Por favor, faça login.');
      window.location.href = 'login.html';
      return;
    }

    // 2. Injetar Navbar e Footer
    document.body.insertAdjacentHTML('afterbegin', View.renderNavbar(user));
    document.body.insertAdjacentHTML('beforeend',  View.renderFooter());

    // 3. Logout
    document.getElementById('btn-logout')?.addEventListener('click', () => {
      localStorage.removeItem('user');
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    // ── Função auxiliar: preencher sidebar e avatar ─────────────────────
    function fillSidebar(u) {
      const initials = u.name
        ? u.name.split(' ').slice(0, 2).map(n => n[0].toUpperCase()).join('')
        : '?';
      document.getElementById('avatar-initials').textContent = initials;
      document.getElementById('sidebar-name').textContent   = u.name  || '—';
      document.getElementById('sidebar-email').textContent  = u.email || '—';
    }

    // ── Função auxiliar: preencher formulário ───────────────────────────
    function fillForm(u) {
      document.getElementById('profile-name').value    = u.name    || '';
      document.getElementById('profile-email').value   = u.email   || '';
      document.getElementById('profile-contact').value = u.contact || '';
    }

    // 4. Preencher com dados do localStorage imediatamente (sem esperar fetch)
    fillSidebar(user);
    fillForm(user);

    // 5. Ir buscar dados frescos à BD via GET /users/me
    try {
      const res = await fetch('http://localhost:3000/users/me', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.ok) {
        const freshUser = await res.json();

        // Atualizar localStorage com dados frescos
        const merged = { ...user, ...freshUser };
        localStorage.setItem('user', JSON.stringify(merged));

        // Atualizar UI
        fillSidebar(merged);
        fillForm(merged);
      } else if (res.status === 403) {
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        window.location.href = 'login.html';
        return;
      }
    } catch (err) {
      console.warn('Não foi possível refrescar o perfil:', err.message);
      // Continua com os dados do localStorage
    }

    // 6. Guardar alterações do perfil — PUT /users/me
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name    = document.getElementById('profile-name').value.trim();
      const email   = document.getElementById('profile-email').value.trim();
      const contact = document.getElementById('profile-contact').value.trim();
      const msgEl   = document.getElementById('profile-msg');

      msgEl.textContent = '';
      msgEl.style.color = 'var(--color-success)';

      try {
        const res = await fetch('http://localhost:3000/users/me', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, email, contact })
        });

        const data = await res.json();

        if (res.ok) {
          // Atualizar localStorage com dados atualizados
          const updated = { ...user, ...data.user };
          localStorage.setItem('user', JSON.stringify(updated));
          user = updated;

          fillSidebar(updated);
          msgEl.textContent = '✓ Perfil guardado com sucesso!';
          View.showToast('Perfil atualizado!', 'success');
        } else {
          msgEl.style.color = 'var(--color-danger)';
          msgEl.textContent = data.error || 'Erro ao guardar.';
        }
      } catch (err) {
        msgEl.style.color = 'var(--color-danger)';
        msgEl.textContent = 'Erro ao ligar ao servidor.';
      }
    });

    
  });
  // Modal — abrir/fechar
  const modal = document.getElementById('vehicle-modal');
  document.getElementById('btn-add-vehicle').addEventListener('click', () => {
    modal.classList.add('open');
  });
  
  document.getElementById('btn-close-modal').addEventListener('click', () => {
  modal.classList.remove('open');
  });
  document.getElementById('btn-cancel-vehicle').addEventListener('click', () => {
  modal.classList.remove('open');
  });

  modal.addEventListener('click', (e) => {
  if (e.target === modal) modal.classList.remove('open');
  });
  
  </script>
</body>
</html>
